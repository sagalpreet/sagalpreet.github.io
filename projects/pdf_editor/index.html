<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Text Editor | Sagalpreet Singh</title>
  <meta name="description" content="A client-side PDF text editor: turns the text already in your PDF into editable, movable fields you can restyle, redact and export. Nothing is uploaded.">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/images/nicons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/nicons/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/images/nicons/apple-touch-icon.png">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <link rel="preload" href="/assets/fonts/inter-var.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <!-- page stylesheet last: it overrides a few shared patterns (.toast, .divider)
       that this tool uses differently. -->
  <link rel="stylesheet" href="styles.css">
  <script src="/assets/js/site.js" defer></script>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- pdf-lib CDN -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-bar">
    <div class="site-bar__inner">
      <a class="site-bar__home" href="/">Sagalpreet Singh</a>
      <span class="site-bar__sep">/</span>
      <a class="site-bar__crumb" href="/projects/" style="color:var(--muted)">Utilities</a>
      <nav class="site-bar__nav" aria-label="Primary">
        <a class="site-bar__link" href="/blog.html">Blog</a>
        <a class="site-bar__link" href="/projects/">All utilities</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="pdf-app">

    <!-- Document-level actions -->
    <div class="app-toolbar">
      <div class="tool-group">
        <h1 class="app-title">PDF Text Editor</h1>
        <span class="tag privacy-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Runs entirely in your browser
        </span>
      </div>

      <div class="tool-group tool-group--end">
        <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        <button class="btn btn--sm" id="btn-upload" title="Open local PDF document">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Open PDF
        </button>

        <button class="btn btn--sm" id="btn-sample" title="Load sample document to try immediately">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Load sample
        </button>

        <button class="btn btn--sm btn--primary" id="btn-export" disabled title="Save modified PDF document">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span id="export-text">Export PDF</span>
        </button>
      </div>
    </div>

    <!-- Page / zoom / edit tools. The sub-toolbar id below is a JS hook:
         app.js treats a click inside it as "not a click away from the
         currently selected field", so it must not be renamed. -->
    <div class="app-toolbar app-toolbar--sub" id="sub-toolbar">
      <div class="tool-group">
        <button class="btn btn--sm btn--icon" id="btn-prev" disabled title="Previous page" aria-label="Previous page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="page-indicator nums" id="page-num-display">Page 0 of 0</span>
        <button class="btn btn--sm btn--icon" id="btn-next" disabled title="Next page" aria-label="Next page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <button class="btn btn--sm btn--icon" id="btn-zoom-out" disabled title="Zoom out" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <span class="zoom-indicator nums" id="zoom-display">100%</span>
        <button class="btn btn--sm btn--icon" id="btn-zoom-in" disabled title="Zoom in" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>
        <button class="btn btn--sm" id="btn-zoom-fit" disabled title="Fit page width">Fit</button>
      </div>

      <div class="tool-group tool-group--end">
        <button class="btn btn--sm btn-secondary" id="btn-add-text" disabled title="Add a custom text box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Add text box
        </button>

        <!-- app.js swaps btn-secondary / btn-primary on this one to show the
             toggle state, so both hook classes must stay styled. -->
        <button class="btn btn--sm btn-secondary" id="btn-toggle-preview" disabled title="Toggle clean document preview (hide edit field borders)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Clean preview
        </button>

        <span class="tool-sep" aria-hidden="true"></span>

        <span class="edits-counter" id="edits-counter">0 edits made</span>
        <button class="btn btn--sm btn--icon" id="btn-clear-edits" disabled title="Reset all edits" aria-label="Reset all edits">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    </div>

    <!-- Workspace area -->
    <div class="workspace">
      <!-- Initial drop zone -->
      <div class="dropzone-overlay" id="dropzone">
        <div class="dropzone" id="dropzone-card">
          <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          <h2>Drop a PDF here</h2>
          <p>The file is parsed locally, inside this tab. Nothing is uploaded to a server.</p>
          <button class="btn btn--primary" id="btn-browse-file">Choose PDF file</button>

          <div class="dropzone__alt">
            <button class="btn btn--block" id="btn-sample-landing">
              Try a sample invoice
            </button>
          </div>
        </div>
      </div>

      <!-- PDF canvas viewport -->
      <div class="pdf-viewport" id="viewport">
        <div class="pdf-page-container" id="page-container" style="display: none;">
          <canvas id="pdf-canvas" class="pdf-canvas"></canvas>
          <div id="text-overlay" class="text-overlay"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Floating text formatting toolbar -->
  <div class="floating-toolbar" id="floating-toolbar" role="group" aria-label="Text formatting">
    <select class="select" id="font-family-select" title="Font family" aria-label="Font family">
      <option value="Helvetica">Helvetica (sans-serif)</option>
      <option value="Times-Roman">Times Roman (serif)</option>
      <option value="Courier">Courier (monospace)</option>
    </select>

    <div class="ft-field" title="Font size (pt)">
      <input type="number" class="input fsize-input" id="font-size-select" list="font-size-presets" min="4" max="200" step="0.5" value="12" aria-label="Font size in points">
      <span class="ft-unit">pt</span>
      <datalist id="font-size-presets">
        <option value="6"></option>
        <option value="8"></option>
        <option value="9"></option>
        <option value="10"></option>
        <option value="11"></option>
        <option value="12"></option>
        <option value="14"></option>
        <option value="16"></option>
        <option value="18"></option>
        <option value="20"></option>
        <option value="24"></option>
        <option value="30"></option>
        <option value="36"></option>
        <option value="48"></option>
        <option value="72"></option>
      </datalist>
    </div>

    <div class="ft-field" title="Text colour">
      <label class="ft-unit" for="text-color-input">Text</label>
      <input type="color" class="color-input" id="text-color-input" value="#000000">
    </div>

    <div class="ft-field" title="Background mask / fill colour">
      <label class="ft-unit" for="bg-color-input">Fill</label>
      <input type="color" class="color-input" id="bg-color-input" value="#ffffff">
    </div>

    <span class="tool-sep" aria-hidden="true"></span>

    <button class="btn btn--sm btn--icon is-positive" id="btn-restore-field" title="Restore original text" aria-label="Restore original text" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    </button>

    <button class="btn btn--sm btn--icon is-critical" id="btn-toggle-redact" title="Redact / black out text element" aria-label="Redact text element">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
    </button>

    <button class="btn btn--sm btn--icon" id="btn-delete-field" title="Delete text element (mask white)" aria-label="Delete text element">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    </button>
  </div>

  <!-- Toast notification container -->
  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <footer class="site-foot">
    <div class="site-foot__inner">
      <span>© 2026 Sagalpreet Singh</span>
      <span class="row" style="gap:var(--sp-4)">
        <a href="/">Home</a>
        <a href="/projects/">Utilities</a>
        <a href="/blog.html">Blog</a>
      </span>
    </div>
  </footer>

  <!-- Application logic -->
  <script src="app.js"></script>
</body>

</html>
