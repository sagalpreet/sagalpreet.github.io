<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client-Side PDF Text Editor - Edit PDF Text Online Free</title>
  <meta name="description" content="100% client-side PDF text editor that turns existing text in your PDF into interactive, editable fields. Privacy-first, browser-based, no upload needed.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- pdf-lib CDN -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="app-header">
    <a href="../index.html" class="brand">
      <div class="brand-icon">P</div>
      <div>
        <h1>PDF Text Editor</h1>
      </div>
    </a>

    <div class="badge-privacy">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      100% Client-Side & Private
    </div>

    <div class="header-controls">
      <input type="file" id="file-input" accept="application/pdf" style="display: none;">
      <button class="btn btn-secondary" id="btn-upload" title="Open local PDF document">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        Open PDF
      </button>

      <button class="btn btn-secondary" id="btn-sample" title="Load sample document to try immediately">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Load Sample
      </button>

      <button class="btn btn-primary" id="btn-export" disabled title="Save modified PDF document">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span id="export-text">Export PDF</span>
      </button>
    </div>
  </header>

  <!-- Sub Navigation Toolbar -->
  <div class="sub-toolbar" id="sub-toolbar">
    <div class="tool-group">
      <button class="btn btn-secondary btn-icon" id="btn-prev" disabled title="Previous Page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <span class="page-indicator" id="page-num-display">Page 0 of 0</span>
      <button class="btn btn-secondary btn-icon" id="btn-next" disabled title="Next Page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <div class="divider"></div>

      <button class="btn btn-secondary btn-icon" id="btn-zoom-out" disabled title="Zoom Out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <span class="zoom-indicator" id="zoom-display">100%</span>
      <button class="btn btn-secondary btn-icon" id="btn-zoom-in" disabled title="Zoom In">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      </button>
      <button class="btn btn-secondary" id="btn-zoom-fit" disabled title="Fit Page Width">Fit</button>
    </div>

    <div class="tool-group">
      <button class="btn btn-secondary" id="btn-add-text" disabled title="Click to add custom text box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
        Add Text Box
      </button>

      <button class="btn btn-secondary" id="btn-toggle-preview" disabled title="Toggle Clean Document Preview (Hide edit field borders)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Clean Preview
      </button>
      
      <div class="divider"></div>

      <span id="edits-counter" style="font-size: 0.8rem; color: var(--text-muted);">0 edits made</span>
      <button class="btn btn-secondary btn-icon" id="btn-clear-edits" disabled title="Reset all edits">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>
  </div>

  <!-- Workspace area -->
  <main class="workspace">
    <!-- Initial Dropzone -->
    <div class="dropzone-overlay" id="dropzone">
      <div class="dropzone-card" id="dropzone-card">
        <div class="dropzone-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        </div>
        <h2>Drag & Drop your PDF file here</h2>
        <p>Your document is processed 100% locally inside your browser. No files are uploaded to any server.</p>
        <button class="btn btn-primary" id="btn-browse-file">Choose PDF File</button>

        <div class="sample-btn-wrapper">
          <button class="btn btn-secondary" id="btn-sample-landing" style="width: 100%; justify-content: center;">
            ⚡ Try Sample Document (Sample Invoice)
          </button>
        </div>
      </div>
    </div>

    <!-- PDF Canvas Viewport -->
    <div class="pdf-viewport" id="viewport">
      <div class="pdf-page-container" id="page-container" style="display: none;">
        <canvas id="pdf-canvas" class="pdf-canvas"></canvas>
        <div id="text-overlay" class="text-overlay"></div>
      </div>
    </div>
  </main>

  <!-- Floating Text Formatting Toolbar -->
  <div class="floating-toolbar" id="floating-toolbar">
    <select class="toolbar-select" id="font-family-select" title="Font Family">
      <option value="Helvetica">Helvetica (Sans-Serif)</option>
      <option value="Times-Roman">Times Roman (Serif)</option>
      <option value="Courier">Courier (Monospace)</option>
    </select>

    <div style="display: flex; align-items: center; gap: 4px;" title="Font Size (pt)">
      <input type="number" class="toolbar-input" id="font-size-select" list="font-size-presets" min="4" max="200" step="0.5" value="12" style="width: 65px; text-align: center;">
      <span style="font-size: 0.75rem; color: var(--text-muted);">pt</span>
      <datalist id="font-size-presets">
        <option value="6"></option>
        <option value="8"></option>
        <option value="9"></option>
        <option value="10"></option>
        <option value="11"></option>
        <option value="12"></option>
        <option value="14"></option>
        <option value="16"></option>
        <option value="18"></option>
        <option value="20"></option>
        <option value="24"></option>
        <option value="30"></option>
        <option value="36"></option>
        <option value="48"></option>
        <option value="72"></option>
      </datalist>
    </div>

    <div class="color-picker-wrapper" title="Text Color">
      <span style="font-size: 0.75rem; color: var(--text-muted);">Text:</span>
      <input type="color" class="color-input" id="text-color-input" value="#000000">
    </div>

    <div class="color-picker-wrapper" title="Background Mask / Fill Color">
      <span style="font-size: 0.75rem; color: var(--text-muted);">Fill:</span>
      <input type="color" class="color-input" id="bg-color-input" value="#ffffff">
    </div>

    <div class="divider"></div>

    <button class="btn btn-secondary btn-icon" id="btn-restore-field" title="Restore original text" style="display: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    </button>

    <button class="btn btn-secondary btn-icon" id="btn-toggle-redact" title="Redact / Blackout text element">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
    </button>

    <button class="btn btn-secondary btn-icon" id="btn-delete-field" title="Delete text element (Mask white)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    </button>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
